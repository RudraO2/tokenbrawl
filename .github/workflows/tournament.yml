name: Tournament

# Story 5.3 / FR-20. One SEGMENT of the tournament per weekday; one tournament
# per week. The five-day spread is not computed here and there is no scheduler
# in this file -- it is what happens when the same resumable command runs five
# times against the same output directory. Segment N+1 learns what segment N
# finished by listing the Command Logs segment N committed (AD-9).
#
# Nothing in this workflow may assume it completes the tournament. A segment
# ends when the outstanding set is empty, when every provider's daily quota is
# spent and its Deployments are parked, or when the job times out -- and the
# next segment cannot tell which of the three happened.

on:
  schedule:
    # 03:00 UTC, every day.
    #
    # Was Monday-to-Friday until Story 7.1, and that was never a weekend-off
    # policy -- it was sized to the workload: "~4,500 calls per Deployment
    # against a 1,000-RPD ceiling is 4.5 days". Story 7.1 doubled the plan by
    # playing every pairing from both sides, so the same arithmetic now gives
    # ~9,000 calls and nine segments. Keeping `1-5` would not have preserved
    # 5.3's decision, only its number after the input changed.
    #
    # Seven days rather than five because the free-tier allowance resets daily
    # whether or not it is used: skipping Saturday and Sunday discards two days
    # of it per week and buys nothing back. Hosted-runner minutes are free on a
    # public repository (INV-8's other half, checked in this file's runner
    # pins), so the cadence is indifferent there too.
    #
    # The shorter window is also the more honest dataset. Two calendar weeks is
    # long enough for a provider to swap the model behind an endpoint or move a
    # free-tier limit mid-tournament, and Matches from day 1 and day 14 are
    # published as though contemporaneous.
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Rehearse the schedule without spending quota'
        type: boolean
        default: true
      config:
        description: 'Path to the run config'
        type: string
        default: configs/tournament.config.json

# The commit back to the default branch is the whole point (AC2), and it is
# what triggers the static redeploy (AC3).
permissions:
  contents: write

# Load-bearing, not tidiness. Two segments running at once would double-spend
# the daily quota this schedule exists to conserve, and would race each other's
# push -- the loser failing on a non-fast-forward *after* having spent its
# quota. Queue, never cancel: a cancelled segment loses the Matches it has run
# but not yet committed.
concurrency:
  group: tournament
  cancel-in-progress: false

jobs:
  tournament:
    runs-on: ubuntu-latest
    # 5.5h, inside GitHub's 6h job cap with margin. The timeout is an ordinary
    # end to a segment, not a failure.
    timeout-minutes: 330

    env:
      DRY_RUN: ${{ inputs.dry_run == true }}
      CONFIG_PATH: ${{ inputs.config || 'configs/tournament.config.json' }}
      # Both paths are staged by the commit step. `docs/reports` is listed
      # deliberately though nothing writes a leaderboard there yet: Story 7.2
      # owns rating computation and leaderboard generation, and a generator it
      # lands in either path is committed by this workflow with no edit here.
      COMMIT_PATHS: apps/web/public/replays docs/reports

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      # `continue-on-error` so that a segment which dies partway still reaches
      # the commit step: the logs it already wrote are completed Matches, and
      # discarding them would throw away real provider quota. The job is failed
      # explicitly by the last step instead.
      - name: Run tournament segment
        id: tournament
        continue-on-error: true
        env:
          # The only place a secret appears. Bound to the process environment,
          # never interpolated into the script below -- an `echo`, a `set -x`,
          # or a failing command's own error text would otherwise print it
          # (AC5, mechanism 1).
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GOOGLE_AI_STUDIO_API_KEY: ${{ secrets.GOOGLE_AI_STUDIO_API_KEY }}
        run: |
          set -uo pipefail
          # `node` directly, NOT `npm run tokenbrawl -w packages/cli --`, for
          # two independent reasons. Both were found by running the documented
          # command on a real machine, and neither is visible in a unit test:
          #
          # 1. npm consumes `--config` and `--dry-run` even after `--`. They
          #    are npm's own flags, so the CLI received `tournament
          #    configs/tournament.config.json` with the options stripped and
          #    exited 2 on "Unexpected argument".
          # 2. `-w packages/cli` runs with cwd = packages/cli, so the config's
          #    relative `outputDir` would resolve to
          #    packages/cli/apps/web/public/replays -- outside COMMIT_PATHS.
          #    Every Match would run, cost real quota, and be staged by
          #    nothing.
          #
          # Run from the repository root so `outputDir` and `--config` resolve
          # against it. `bin/register.mjs` is the module-resolution shim this
          # repo's "Bundler" TypeScript needs; it is path-independent.
          if [ "$DRY_RUN" = "true" ]; then
            node --experimental-strip-types --no-warnings \
              --import ./packages/cli/bin/register.mjs packages/cli/src/cli.ts \
              tournament --config "$CONFIG_PATH" --dry-run
          else
            node --experimental-strip-types --no-warnings \
              --import ./packages/cli/bin/register.mjs packages/cli/src/cli.ts \
              tournament --config "$CONFIG_PATH"
          fi

      # Story 7.2. `docs/reports` has been in COMMIT_PATHS since 5.3, which
      # makes a leaderboard committable; it does not make one exist. This step
      # is what generates it, and without it the published board would be
      # whatever was last written by hand.
      #
      # `if: always()`, and deliberately no secret bound: the command reads the
      # Command Logs already on disk, plays no Match and resolves no API key, so
      # it republishes correctly after a segment that died partway -- including
      # one that died because a key was missing. Its own failure is allowed to
      # fail the job: a board that silently stopped being regenerated looks
      # exactly like a board nobody has looked at.
      #
      # It runs on a dry run too. The commit step is skipped there, so the files
      # are written into a workspace that is thrown away -- and rehearsing the
      # generator is the point of a rehearsal. A dry run still spends no quota:
      # this step issues no provider call at all.
      - name: Generate leaderboard
        if: always()
        run: |
          set -uo pipefail
          node --experimental-strip-types --no-warnings \
            --import ./packages/cli/bin/register.mjs packages/cli/src/cli.ts \
            leaderboard --config "$CONFIG_PATH"

      # Runs before the commit step and gates it. The CLI already refuses to
      # write a document containing a key; this is the check that does not
      # trust it (AC5, mechanism 4).
      - name: Assert no secret leaked into the tree
        id: leak
        if: always()
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GOOGLE_AI_STUDIO_API_KEY: ${{ secrets.GOOGLE_AI_STUDIO_API_KEY }}
        run: |
          bash scripts/assert-no-secret-leak.sh \
            GROQ_API_KEY CEREBRAS_API_KEY GOOGLE_AI_STUDIO_API_KEY

      # Path-based rather than artifact-based, so Story 7.2's leaderboard is
      # picked up without an edit here. No deploy step: a commit on the default
      # branch triggers the Vercel redeploy through Vercel's own git
      # integration (docs/ARCHITECTURE.md), which is exactly what AC3 means by
      # "no separate deploy hook is needed".
      - name: Commit results
        if: >-
          always()
          && steps.leak.outcome == 'success'
          && env.DRY_RUN != 'true'
          && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git config user.name  'tokenbrawl-tournament[bot]'
          git config user.email 'tokenbrawl-tournament@users.noreply.github.com'

          git add -- $COMMIT_PATHS

          if git diff --cached --quiet; then
            echo 'No new Command Logs this segment; nothing to commit.'
            exit 0
          fi

          git commit -m "tournament: results from segment $(date -u +%Y-%m-%d)"

          # The concurrency group makes a racing segment impossible, but a
          # human push during a 5-hour segment is not. Rebase rather than
          # merge: these commits are append-only artifacts with no conflicts
          # to resolve, and a merge commit here would be noise on the default
          # branch forever.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      # `continue-on-error` above swallowed the segment's exit code so the
      # commit could happen. Surface it here, or a permanently broken
      # tournament would report five green runs a week.
      - name: Fail if the segment errored
        if: always() && steps.tournament.outcome == 'failure'
        run: |
          echo 'The tournament segment exited non-zero. Any Matches it completed' >&2
          echo 'were still committed above; the outstanding set is unchanged for' >&2
          echo 'the next segment.' >&2
          exit 1
