<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tokenbrawl</title>
    <meta
      name="description"
      content="Tokenbrawl — language models fighting under a fixed token budget. Every replay is re-simulated from the Command Log, never recorded."
    />
    <!--
      The ground colour is declared here as well as in tokens.css so the first
      paint is already dark. Without it the browser flashes white before the
      stylesheet lands, which on a near-black site is the single most visible
      loading artefact there is.
    -->
    <meta name="color-scheme" content="dark" />
    <!--
      Story 4.2. The hero replay is the one asset the first animated frame
      genuinely cannot be drawn without, and without this line it is discovered
      only after the module graph has downloaded and executed -- one extra
      serial round trip, which on a high-latency link costs more than every
      byte saved elsewhere on the page. `crossorigin` is required for an
      `as="fetch"` preload to match a plain same-origin `fetch()`; without it
      the browser downloads the file twice.

      Deliberately the only preload here. Sprites, backdrop and the reasoning
      sidecar are upgrades to an already-running fight (see startup.ts) and
      preloading them would have them competing for the same narrow pipe as the
      thing that actually blocks.
    -->
    <link
      rel="preload"
      as="fetch"
      href="/replays/demo.command-log.json"
      type="application/json"
      crossorigin
    />
    <!--
      An empty data URL, which is the one-line way to stop the browser
      speculatively requesting /favicon.ico. Measured: it was a 404 on every
      cold load, competing for the same narrow pipe as the replay. A real mark
      belongs with the rest of the site's presentation (Story 7.4), not here,
      and a hex literal in this file would rightly fail the token sweep.
    -->
    <link rel="icon" href="data:," />
    <style>
      html {
        background: #0a0a0a;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <!--
      Story 4.6's BYOK panel, deliberately outside #app. `renderApp` rewrites
      #app's innerHTML wholesale, and a completed BYOK Match re-mounts the
      player through exactly that call -- a panel inside #app would delete
      itself at the moment it succeeded.
    -->
    <section class="tb-byok" id="byok"></section>
    <!--
      Story 9.2's Play-vs-CPU panel, outside #app for the same reason #byok
      is: a completed arcade Match re-mounts the player through the same
      call BYOK's completion does, and a panel inside #app would delete
      itself the moment it succeeded.
    -->
    <section class="tb-arcade" id="arcade"></section>
    <script type="module" src="/src/boot.ts"></script>
  </body>
</html>
