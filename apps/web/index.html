<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tokenbrawl — the LLM fighting-game benchmark</title>
    <meta
      name="description"
      content="Tokenbrawl — language models fighting under a fixed token budget. Watch the stream, replay any Match from its Command Log, or step into the cabinet and fight the CPU yourself."
    />
    <meta name="color-scheme" content="dark" />
    <!--
      The hero replay is the one asset the first animated frame cannot be drawn
      without; preloading it saves a serial round trip on the critical path.
      `startup.test.ts` asserts the page's first request is `DEMO_REPLAY_URL`,
      and `exhibition-artefact.test.ts` asserts this href is the same URL.
    -->
    <link
      rel="preload"
      as="fetch"
      href="/replays/exhibition.command-log.json"
      type="application/json"
      crossorigin
    />
    <link rel="icon" href="/arena/assets/ui/favicon.png" />
    <!--
      The ground colour is declared inline as well as in tokens.css so the first
      paint is already dark. Pinned to `--tb-bg` by style-discipline.test.ts.
    -->
    <style>
      html {
        background: #07080f;
      }
    </style>
  </head>
  <body>
    <!--
      The cabinet's top bar: brand, screens and the page's one sound switch.
      `shell/nav.ts` fills the nav; `shell/sound.ts` fills the switch. Both sit
      outside every screen because they are how you leave the one you are on.
    -->
    <header class="tb-topbar">
      <div id="screen-nav"></div>
      <div id="screen-sound"></div>
    </header>
    <!--
      Every section below carries `data-screen`, and exactly one of them
      carries `data-screen-active` at a time -- `shell/router.ts` moves the
      attribute, `app.css` turns it into `display`. Document order still
      matters for a visitor with the stylesheet missing: they get a stacked
      page rather than a blank one.
    -->
    <section class="tb-screen tb-landing" id="landing" data-screen></section>
    <!--
      Play: the arcade cabinet. `play/panel.ts` mounts the cabinet frame and
      the settings; the fight itself runs inside `/arena/`, the reference
      fighter, untouched.
    -->
    <section class="tb-screen tb-play" id="arcade" data-screen></section>
    <section class="tb-screen tb-select" id="select" data-screen></section>
    <section class="tb-screen tb-spectate" id="spectate" data-screen></section>
    <div class="tb-screen" id="app" data-screen></div>
    <!--
      The BYOK panel sits outside #app: `renderApp` rewrites #app's innerHTML
      wholesale, and a completed BYOK Match re-mounts the player through exactly
      that call -- a panel inside #app would delete itself the moment it
      succeeded.
    -->
    <section class="tb-screen tb-byok" id="byok" data-screen></section>
    <footer class="tb-footer">
      <span>Tokenbrawl · deterministic 1v1 · every replay re-simulated from its Command Log</span>
      <span>
        <a href="#/watch">Watch</a> · <a href="#/play">Play</a> · <a href="#/byok">Your keys</a>
      </span>
    </footer>
    <script type="module" src="/src/boot.ts"></script>
  </body>
</html>
