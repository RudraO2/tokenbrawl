<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Tokenbrawl Arena</title>
<link rel="icon" href="./assets/ui/favicon.png">
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #0E0E10; overflow: hidden;
    -webkit-user-select: none; user-select: none;
    touch-action: none;
    font-family: 'Segoe UI', Arial, sans-serif;
  }
  #game {
    display: block;
    position: fixed;
    left: 0;
    top: 0;
    margin: 0;
    background: #000;
    image-rendering: pixelated;
    touch-action: none;
  }

  /* subtle scanline overlay, purely decorative */
  #ng-scanlines {
    position: fixed; inset: 0; pointer-events: none; z-index: 5;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0) 0px,
      rgba(0,0,0,0) 2px,
      rgba(0,0,0,0.10) 3px,
      rgba(0,0,0,0) 4px
    );
    mix-blend-mode: multiply;
    opacity: 0.55;
  }

  /* touch controls - v2.1: floating analog stick (left) + PS-style diamond
     button cluster (right, translucent circles / thin borders / letter-symbol
     labels, per Edison's dojo-reference screenshot). Landscape: transparent
     overlay spanning the whole screen (as v1). Portrait: the SAME container
     becomes the solid bottom "Game Boy" control deck; every child is
     positioned as a PERCENTAGE of this container so it automatically
     relayouts for either shape. */
  .touch-controls {
    position: fixed; left: 0; right: 0; top: 0; bottom: 0;
    z-index: 20; pointer-events: none;
    display: none;
  }
  @media (pointer: coarse), (max-width: 820px) {
    .touch-controls { display: block; }
  }
  body.portrait-deck .touch-controls {
    top: auto; bottom: 0; height: 38vh;
    background: #0A0C12;
    border-top: 1px solid rgba(255,255,255,0.10);
  }

  .stick-zone {
    position: absolute; left: 0; top: 0; width: 50%; height: 100%;
    pointer-events: auto; touch-action: none;
  }

  /* PS diamond cluster box - buttons placed by percentage inside it so the
     same markup works in both the landscape overlay and the portrait deck.
     overflow: visible so the ULTIMATE button can pop in ABOVE the diamond. */
  .btn-cluster {
    position: absolute; right: 2%; bottom: 4%; width: 58%; height: 94%;
    pointer-events: none;
    overflow: visible;
  }
  .touch-controls .abtn {
    position: absolute;
    pointer-events: auto;
    transform: translate(-50%, -50%);
    width: clamp(64px, 9vw, 80px); height: clamp(64px, 9vw, 80px);
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.4);
    background: rgba(255,255,255,0.10);
    color: #EAFBFF;
    font: 800 17px/1 'Segoe UI', Arial, sans-serif;
    display: flex; align-items: center; justify-content: center;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  .touch-controls .abtn:active { background: rgba(255,255,255,0.32); }

  /* PS diamond: triangle top, square left, circle right, cross bottom */
  .btn-triangle { left: 60%; top: 15%; border-color: rgba(56,226,122,0.55); }
  .btn-square   { left: 32%; top: 47%; border-color: rgba(197,205,255,0.55); }
  .btn-circle   { left: 88%; top: 47%; border-color: rgba(255,120,150,0.55); }
  .btn-cross    { left: 60%; top: 79%; background: rgba(242,100,25,0.16); border-color: rgba(242,100,25,0.6); }

  /* POWER: left of the diamond */
  .btn-power {
    left: 5%; top: 47%;
    background: linear-gradient(160deg, rgba(255,120,30,0.35), rgba(255,60,10,0.25));
    border-color: rgba(255,140,40,0.85);
    color: #FFD24A; font-size: 24px;
  }
  /* JUMP: compact, between the stick zone and the diamond */
  .btn-jump {
    left: 5%; top: 12%;
    width: clamp(48px, 6vw, 58px) !important; height: clamp(48px, 6vw, 58px) !important;
    border-color: rgba(22,199,228,0.55); background: rgba(22,199,228,0.16); font-size: 11px;
  }
  /* ULTIMATE: hidden until meter is 100 (screens.js toggles display + aura color);
     pops in ABOVE the diamond, pulsing. */
  .btn-ultimate {
    left: 60%; top: -14%;
    display: none;
    width: clamp(70px, 10vw, 88px) !important; height: clamp(70px, 10vw, 88px) !important;
    background: rgba(255,210,74,0.22);
    border-color: #FFD24A; border-width: 3px;
    color: #FFD24A; font-size: 13px; font-weight: 900;
    box-shadow: 0 0 18px 4px rgba(255,210,74,0.55);
    animation: ngUltimatePulse 1.1s ease-in-out infinite;
  }
  .btn-ultimate.ready { display: flex; }
  @keyframes ngUltimatePulse {
    0%, 100% { transform: translate(-50%, -50%) scale(1); }
    50% { transform: translate(-50%, -50%) scale(1.12); }
  }

  /* "?" tutorial button - always reachable during a fight, top-right of the
     viewport (fixed, independent of the portrait control-deck box). */
  #ng-tutorial-btn {
    position: fixed; top: 14px; right: 14px; z-index: 26;
    pointer-events: auto;
    width: 64px; height: 64px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.35);
    background: rgba(14,14,16,0.55);
    color: #EAFBFF;
    font: 900 24px/1 'Segoe UI', Arial, sans-serif;
    display: none;
    align-items: center; justify-content: center;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  #ng-tutorial-btn.show { display: flex; }
  #ng-tutorial-btn:active { background: rgba(255,255,255,0.22); }

  /* floating stick visuals: positioned via left/top (JS) + centered with transform */
  #ng-stick-base, #ng-stick-knob {
    position: fixed; left: -9999px; top: -9999px;
    transform: translate(-50%, -50%);
    pointer-events: none; z-index: 21; border-radius: 50%;
    display: none;
  }
  #ng-stick-base {
    width: 140px; height: 140px;
    border: 2px solid rgba(22,199,228,0.5);
    background: rgba(22,199,228,0.10);
  }
  #ng-stick-knob {
    width: 64px; height: 64px;
    border: 2px solid rgba(22,199,228,0.85);
    background: rgba(22,199,228,0.32);
  }

  /* landscape suggestion toast - dismissible, never blocks play (replaces the old
     full-screen rotate-device overlay) */
  #ng-landscape-toast {
    position: fixed; left: 50%; bottom: 4%;
    transform: translateX(-50%);
    z-index: 50; display: none;
    align-items: center; gap: 14px;
    max-width: 86vw;
    background: rgba(14,14,16,0.92);
    border: 1px solid rgba(22,199,228,0.4);
    border-radius: 14px;
    padding: 12px 16px;
    color: #EAFBFF;
    font: 700 13px/1.4 'Segoe UI', Arial, sans-serif;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    box-shadow: 0 8px 24px rgba(0,0,0,0.45);
  }
  #ng-landscape-toast button {
    flex: none;
    border: 1px solid rgba(22,199,228,0.6);
    background: rgba(22,199,228,0.18);
    color: #16C7E4;
    font: 800 12px/1 'Segoe UI', Arial, sans-serif;
    text-transform: uppercase;
    border-radius: 8px;
    padding: 8px 12px;
    -webkit-tap-highlight-color: transparent;
  }

  /* whatsapp challenge share button (DOM overlay, online result screen only) */
  #ng-share {
    position: fixed;
    left: 50%;
    bottom: 6%;
    transform: translateX(-50%);
    z-index: 30;
    display: none;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 14px 22px;
    border-radius: 999px;
    background: #128C7E;
    color: #ffffff;
    font-weight: 800;
    letter-spacing: 0.03em;
    text-decoration: none;
    text-transform: uppercase;
    font-size: 14px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.4);
    border: 2px solid #25D366;
  }
  #ng-share:active { background: #0d6b60; }

  /* copy invite-link button (DOM overlay, online lobby / host waiting screen only) */
  #ng-copy {
    position: fixed;
    left: 50%;
    bottom: 13%;
    transform: translateX(-50%);
    z-index: 30;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 12px 22px;
    border-radius: 999px;
    background: #1b2233;
    color: #EAF2FF;
    font-weight: 800;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    font-size: 13px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.4);
    border: 2px solid #3a465f;
    cursor: pointer;
  }
  #ng-copy:active { background: #10151f; }

  /* lobby placement: move invite buttons to the top-right so they clear the roster + hints */
  #ng-share.ng-lobby, #ng-copy.ng-lobby { left: auto; right: 18px; bottom: auto; transform: none; }
  #ng-copy.ng-lobby { top: 74px; }
  #ng-share.ng-lobby { top: 120px; }
</style>

</head>
<body>
  <canvas id="game"></canvas>
  <div id="ng-scanlines"></div>

  <div class="touch-controls" id="touch-controls" aria-hidden="true">
    <div class="stick-zone" id="ng-stick-zone"></div>
    <div class="btn-cluster">
      <button class="abtn btn-jump" data-bit="UP" aria-label="Jump">JUMP</button>
      <button class="abtn btn-triangle" data-bit="HEAVY" aria-label="Heavy attack">▲</button>
      <button class="abtn btn-square" data-bit="LIGHT" aria-label="Light attack">■</button>
      <button class="abtn btn-circle" data-bit="BLAST" aria-label="Blast">●</button>
      <button class="abtn btn-cross" data-bit="DASH" aria-label="Dash">✕</button>
      <button class="abtn btn-power" data-bit="POWER" aria-label="Power charge">🔥</button>
      <button class="abtn btn-ultimate" id="ng-btn-ultimate" data-combo="LIGHT,HEAVY,BLAST" aria-label="Ultimate">ULT</button>
    </div>
  </div>
  <div id="ng-stick-base"></div>
  <div id="ng-stick-knob"></div>
  <button id="ng-tutorial-btn" type="button" aria-label="How to play">?</button>

  <div id="ng-landscape-toast">
    <span id="ng-landscape-toast-text">LANDSCAPE IS BEST FOR THE FULL ARENA VIEW</span>
    <button id="ng-landscape-toast-close" type="button">GOT IT</button>
  </div>
  <a id="ng-share" href="#" target="_blank" rel="noopener"></a>
  <button id="ng-copy" type="button">COPY INVITE LINK</button>

  <script type="module" src="./js/main.js"></script>
  <script type="module">
    // Host bridge. The page that embeds this cabinet (Tokenbrawl) is its menu:
    // it mutes the cabinet with the page's own sound switch, and it hears every
    // screen change and result through postMessage. Nothing in the fight reads
    // any of this.
    import { audio } from './js/audio.js';
    import { app } from './js/screens.js';
    window.addEventListener('message', (event) => {
      const msg = event.data;
      if (!msg || msg.source !== 'tb-host') return;
      if (msg.type === 'sound') audio.mute(!msg.enabled);
      if (msg.type === 'focus') window.focus();
      if (msg.type === 'pause' && app.state.screen === 'fight' && app.state.mode !== 'online') app.state.paused = true;
    });
    try { window.parent.postMessage({ source: 'tb-arena', type: 'ready', screen: app.state.screen }, '*'); } catch (_e) { /* ignore */ }
  </script>
</body>
</html>
